<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/favicon-192.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0a0f" />
		%sveltekit.head%
		<script>
			// Munin Analytics — lightweight page view & click tracking
			// Uses anonymous hashed UUID (no PII, GDPR-friendly)
			(function() {
				var endpoint = '/api/track';
				var sent = {};

				// Anonymous visitor ID: generate UUID, store in localStorage, hash before sending
				function getOrCreateUUID() {
					var key = '_munin_vid';
					var id = localStorage.getItem(key);
					if (!id) {
						id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
							var r = Math.random() * 16 | 0;
							return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
						});
						localStorage.setItem(key, id);
					}
					return id;
				}

				// SHA-256 hash the UUID so the raw ID never leaves the browser
				async function hashUUID(uuid) {
					var data = new TextEncoder().encode(uuid);
					var buf = await crypto.subtle.digest('SHA-256', data);
					return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
				}

				var visitorHashPromise = hashUUID(getOrCreateUUID());

				function track(type, data) {
					visitorHashPromise.then(function(vid) {
						try {
							data.vid = vid;
							var payload = JSON.stringify({ type: type, data: data });
							if (navigator.sendBeacon) {
								navigator.sendBeacon(endpoint, new Blob([payload], { type: 'application/json' }));
							} else {
								fetch(endpoint, { method: 'POST', body: payload, headers: { 'Content-Type': 'application/json' }, keepalive: true });
							}
						} catch(e) {}
					});
				}

				function trackPage() {
					var page = location.pathname;
					if (sent[page] && Date.now() - sent[page] < 2000) return;
					sent[page] = Date.now();

					var params = new URLSearchParams(location.search);
					track('PageView', {
						page: page,
						referrer: document.referrer || null,
						screen: screen.width + 'x' + screen.height,
						language: navigator.language,
						utm_source: params.get('utm_source') || null,
						utm_medium: params.get('utm_medium') || null,
						utm_campaign: params.get('utm_campaign') || null
					});
				}

				if (document.readyState === 'complete') trackPage();
				else window.addEventListener('load', trackPage);

				// Track SvelteKit client-side navigations
				var _pushState = history.pushState;
				history.pushState = function() {
					_pushState.apply(this, arguments);
					setTimeout(trackPage, 50);
				};
				window.addEventListener('popstate', function() { setTimeout(trackPage, 50); });

				// Track clicks on elements with data-track attribute
				document.addEventListener('click', function(e) {
					var el = e.target.closest('[data-track]');
					if (!el) return;
					track('ClickEvent', {
						page: location.pathname,
						element: el.tagName.toLowerCase(),
						action: el.getAttribute('data-track'),
						label: (el.textContent || '').trim().slice(0, 100)
					});
				});
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" style="background-color: #0a0a0f; color: #e5e7eb;">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
